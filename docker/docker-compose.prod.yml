services:
  db:
    restart: always
    # No host port in production — only containers on the internal Docker
    # network (web, tools) need to reach Postgres.
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    restart: always
    # Drop --console-address entirely — fully disables the console server,
    # not just its host port mapping.
    command: server /data
    # S3 API traffic comes in through Caddy's /media proxy now (see
    # docker/Caddyfile), not a directly exposed port.
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    restart: always
    # Caddy is the sole public entrypoint in production.
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 1G

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio

volumes:
  caddy_data:
  caddy_config:
